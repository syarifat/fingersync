# ==============================================================================
# Nixpacks Configuration for Coolify Deployment
# ==============================================================================

# 1. CARA RESMI NIXPACKS UNTUK INSTALL EKSTENSI PHP
[variables]
NIXPACKS_PHP_EXTENSIONS = "pdo_mysql,gd,zip"

# 2. INSTALL DEPENDENCIES
[phases.install]
cmds = [
    "mkdir -p /app/storage/framework/{sessions,views,cache}",
    "mkdir -p /app/storage/logs",
    "mkdir -p /app/bootstrap/cache",
    "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
    "npm ci"
]

# 3. BUILD ASSETS
[phases.build]
cmds = [
    "npm run build",
    "php artisan storage:link || true",
    "php artisan optimize || true"
]
dependsOn = ["install"]

# 4. JALANKAN SERVER
[start]
cmd = "php artisan migrate --force && php artisan storage:link && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=80"